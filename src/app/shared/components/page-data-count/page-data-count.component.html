<div class="data-count-main" *ngIf="displayItems.length">
  <div
    *ngFor="let item of displayItems; let last = last"
    class="single-data-count"
    [class.side-border]="!last"
  >
    <div class="single-data-ttl">{{ item.label }}</div>
    <div class="single-data-val">{{ item.value }}</div>
  </div>
</div>
