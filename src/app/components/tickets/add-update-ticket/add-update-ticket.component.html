<main>
    <div class="popup-main">
        <div class="popup-head">
            <div class="popup-head-ttl">Create Ticket</div>
            <div class="popup-head-btn">
                <button (click)="activeModal.close()"><span class="icon-wrap"><i class="fa-solid fa-x"></i></span></button>
            </div>
        </div>
        <div class="popup-body"><p class="ticket-form-intro">Tell us what you need help with. Include the relevant details so the support team can assist you.</p>
            <div class="row m-0 p-0">
                <div class="col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Subject</label>
                            <input class="form-control" type="text" placeholder="A short summary of your request" maxlength="150" [(ngModel)]="dataReqModel.subject" />
                    </div>
                </div>
                <div class="col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" placeholder="Describe the issue and the steps you have tried" [(ngModel)]="dataReqModel.content"></textarea>
                    </div>
                </div>
                <div class="col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Store</label>@if(storesLoading){<p class="ticket-form-hint">Loading stores...</p>}@if(storesFailed){<p class="ticket-form-hint">Could not load stores. <button type="button" (click)="getStoresList()">Retry</button></p>}
                        <select class="form-select" [(ngModel)]="dataReqModel.storeId" [disabled]="storesLoading || isSaving">
                            <option [ngValue]="null">-- Select Store --</option>
                            @for(item of storeList; track item){
                                <option [ngValue]="item.id">{{item.name}}</option>
                            }
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="popup-footer">
            <button type="button" class="site-btn grey-color" (click)="activeModal.close()" [disabled]="isSaving">Close</button>
            <button type="button" class="site-btn primary-color ms-1" (click)="validateData()" [appBtnLoading]="isSaving" [disabled]="isSaving">
                <span class="site-btn-icon"><i class="fa-solid fa-check"></i></span>
                Create Ticket
            </button>
        </div>
    </div>
</main>
