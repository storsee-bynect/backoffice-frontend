<main>
    <div class="popup-main">
        <div class="popup-head">
            <div class="popup-head-ttl">{{isEdit ? 'Update' : 'Create'}} Store User</div>
            <div class="popup-head-btn">
                <button (click)="activeModal.close()"><span class="icon-wrap"><i class="fa-solid fa-x"></i></span></button>
            </div>
        </div>
        <div class="popup-body">
            <div class="row m-0 p-0">
                <div class="col-lg-6 col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Name</label>
                            <input class="form-control" type="text" placeholder="Enter Name" [(ngModel)]="dataReqModel.name" />
                    </div>
                </div>
                <div class="col-lg-6 col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">
                            Password
                            @if(isEdit && isGoogleLinked){
                                <span class="su-google-tag"><i class="fa-brands fa-google"></i> Google linked</span>
                            }
                        </label>
                            <input class="form-control" type="text" [placeholder]="passwordPlaceholder" [(ngModel)]="dataReqModel.password" />
                            @if(isEdit){
                                <small class="form-hint">
                                    @if(isGoogleLinked){
                                        Google sign-in keeps working. Set a password to also allow email + password login.
                                    }@else {
                                        Leave blank to keep the current password.
                                    }
                                </small>
                            }
                    </div>
                </div>
                <div class="col-lg-6 col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Email</label>
                            <input class="form-control" type="text" placeholder="Enter Email" [(ngModel)]="dataReqModel.email" />
                    </div>
                </div>
                <div class="col-lg-6 col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Mobile</label>
                            <input class="form-control" type="number" OnlyNumber placeholder="Enter Mobile" [(ngModel)]="dataReqModel.mobile" />
                    </div>
                </div>
                <div class="col-lg-6 col-12 mb-2">
                    <div class="form-inp-main">
                        <label class="form-label">Store</label>
                        <select class="form-select" [(ngModel)]="dataReqModel.storeId" [disabled]="isEdit || !!presetStoreId">
                            <option [value]="null">--- Select Store ---</option>
                            @for(item of storeList; track item){
                                <option [value]="item.id">{{item.name}}</option>
                            }
                        </select>
                        @if(isEdit){
                            <small class="form-hint">A user stays with the store it was created for.</small>
                        }
                    </div>
                </div>
            </div>
        </div>
        <div class="popup-footer">
            <button type="button" class="site-btn grey-color" (click)="activeModal.close()" [disabled]="isSaving">Close</button>
            <button type="button" class="site-btn primary-color ms-1" (click)="validateData()" [appBtnLoading]="isSaving" [disabled]="isSaving">
                <span class="site-btn-icon"><i class="fa-solid fa-check"></i></span>
                {{isEdit ? 'Update' : 'Create'}}
            </button>
        </div>
    </div>
</main>
